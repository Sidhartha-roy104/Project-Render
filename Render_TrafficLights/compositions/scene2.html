<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 2 - Inside the Controller</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('../assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0a0b10;
      font-family: 'Oswald', -apple-system, sans-serif;
    }
    .scene-container {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 50%;
    }

    /* Top-Left Title */
    .title-group {
      position: absolute;
      top: 140px;
      left: 70px;
      z-index: 20;
    }
    .accent-bar {
      width: 60px;
      height: 4px;
      background: #06b6d4;
      margin-bottom: 16px;
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.6);
    }
    .category-badge {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #06b6d4;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }
    .main-title {
      font-size: 60px;
      font-weight: 700;
      line-height: 1.1;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
    }
    .main-title span {
      color: #f59e0b;
      text-shadow: 0 0 25px rgba(245, 158, 11, 0.6);
    }

    /* SVG Connecting Lines Layer */
    .svg-lines {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
      z-index: 15;
    }

    /* Technical Callout Badges */
    .callout {
      position: absolute;
      padding: 14px 24px;
      background: rgba(11, 15, 25, 0.92);
      border: 1px solid rgba(6, 182, 212, 0.5);
      border-left: 6px solid #06b6d4;
      border-radius: 8px;
      color: #ffffff;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.7), 0 0 15px rgba(6, 182, 212, 0.2);
      backdrop-filter: blur(10px);
      z-index: 20;
    }
    .callout-title {
      font-size: 32px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #06b6d4;
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .callout-desc {
      font-size: 28px;
      font-weight: 400;
      color: #cbd5e1;
      letter-spacing: 1px;
    }

    .callout-1 {
      top: 520px;
      left: 80px;
      border-left-color: #f59e0b;
    }
    .callout-1 .callout-title { color: #f59e0b; }

    .callout-2 {
      top: 920px;
      right: 70px;
    }

    .callout-3 {
      bottom: 260px;
      left: 80px;
      border-left-color: #10b981;
    }
    .callout-3 .callout-title { color: #10b981; }

    /* Circuit Scan Glow Beam */
    .circuit-beam {
      position: absolute;
      top: 600px;
      left: 300px;
      width: 480px;
      height: 8px;
      background: linear-gradient(90deg, transparent, #06b6d4, #ffffff, #06b6d4, transparent);
      box-shadow: 0 0 20px #06b6d4;
      border-radius: 4px;
      opacity: 0;
      pointer-events: none;
      z-index: 12;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div class="scene-container" data-composition-id="scene2">
    <img id="bgImage" class="bg-img" src="../assets/images/shot2.jpg" alt="Cabinet Cutaway">

    <div class="title-group" id="titleGroup">
      <div class="accent-bar" id="accentBar"></div>
      <div class="category-badge" id="catBadge">CORE ARCHITECTURE</div>
      <h1 class="main-title" id="mainTitle">A MINI <span>COMPUTER</span></h1>
    </div>

    <!-- SVG Circuit Lines -->
    <svg class="svg-lines" viewBox="0 0 1080 1920">
      <defs>
        <filter id="glow">
          <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
          <feMerge>
            <feMergeNode in="coloredBlur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>
      <path id="line1" d="M 380 570 L 520 720" stroke="#f59e0b" stroke-width="3" stroke-dasharray="6,4" fill="none" filter="url(#glow)"/>
      <circle id="dot1" cx="520" cy="720" r="7" fill="#f59e0b" filter="url(#glow)"/>

      <path id="line2" d="M 700 970 L 560 1080" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,4" fill="none" filter="url(#glow)"/>
      <circle id="dot2" cx="560" cy="1080" r="7" fill="#06b6d4" filter="url(#glow)"/>

      <path id="line3" d="M 380 1680 L 500 1560" stroke="#10b981" stroke-width="3" stroke-dasharray="6,4" fill="none" filter="url(#glow)"/>
      <circle id="dot3" cx="500" cy="1560" r="7" fill="#10b981" filter="url(#glow)"/>
    </svg>

    <!-- Circuit Scan Beam -->
    <div class="circuit-beam" id="circuitBeam"></div>

    <!-- Callouts -->
    <div class="callout callout-1" id="callout1">
      <div class="callout-title">MICROPROCESSOR</div>
      <div class="callout-desc">Phase logic & timing controller</div>
    </div>

    <div class="callout callout-2" id="callout2">
      <div class="callout-title">SOLID-STATE RELAYS</div>
      <div class="callout-desc">Switches 230V signal lamps</div>
    </div>

    <div class="callout callout-3" id="callout3">
      <div class="callout-title">BATTERY BACKUP</div>
      <div class="callout-desc">Uninterrupted power supply</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene2"] = tl;

    // Subtle camera zoom through internal components
    tl.fromTo("#bgImage", 
      { scale: 1.05, y: -10 }, 
      { scale: 1.15, y: 15, duration: 7.06, ease: "none" }, 0
    );

    // Title reveal
    tl.fromTo("#accentBar", { width: 0, opacity: 0 }, { width: 60, opacity: 1, duration: 0.35 }, 0.1);
    tl.fromTo("#catBadge", { y: -15, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, 0.2);
    tl.fromTo("#mainTitle", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.4);

    // Callout 1 (Microprocessor, sync with "signal controller" ~0.8s)
    tl.fromTo("#callout1", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, 0.8);
    tl.fromTo("#line1", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.4 }, 0.8);
    tl.fromTo("#dot1", { scale: 0 }, { scale: 1, duration: 0.2 }, 1.1);

    // Circuit scan beam sweep across PCB (sync with "basically a small computer" ~2.7s)
    tl.fromTo("#circuitBeam", 
      { y: -60, opacity: 0 }, 
      { y: 350, opacity: 0.9, duration: 1.4, ease: "power1.inOut" }, 2.6
    );

    // Callout 2 (Relays, ~3.2s)
    tl.fromTo("#callout2", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, 3.2);
    tl.fromTo("#line2", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.4 }, 3.2);
    tl.fromTo("#dot2", { scale: 0 }, { scale: 1, duration: 0.2 }, 3.5);

    // Callout 3 (Battery, ~4.8s)
    tl.fromTo("#callout3", { scale: 0.7, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, 4.8);
    tl.fromTo("#line3", { strokeDashoffset: 100 }, { strokeDashoffset: 0, duration: 0.4 }, 4.8);
    tl.fromTo("#dot3", { scale: 0 }, { scale: 1, duration: 0.2 }, 5.1);
  </script>
</body>
</html>
