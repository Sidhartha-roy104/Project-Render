<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 7 - Emergency Green Corridor</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('../assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0a0b10;
      font-family: 'Oswald', -apple-system, sans-serif;
    }
    .scene-container {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 50%;
    }

    /* Top-Left Title */
    .title-group {
      position: absolute;
      top: 140px;
      left: 70px;
      z-index: 20;
    }
    .accent-bar {
      width: 60px;
      height: 4px;
      background: #10b981;
      margin-bottom: 16px;
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.7);
    }
    .category-badge {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }
    .main-title {
      font-size: 60px;
      font-weight: 700;
      line-height: 1.1;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
    }
    .main-title span {
      color: #10b981;
      text-shadow: 0 0 25px rgba(16, 185, 129, 0.7);
    }

    /* SVG Route & Central Command Overlay */
    .svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
      z-index: 15;
    }

    /* Corridor Control Dashboard */
    .corridor-panel {
      position: absolute;
      bottom: 240px;
      left: 70px;
      right: 70px;
      padding: 26px 30px;
      background: rgba(11, 15, 25, 0.94);
      border: 1px solid rgba(16, 185, 129, 0.5);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 20px rgba(16, 185, 129, 0.2);
      backdrop-filter: blur(12px);
      z-index: 25;
    }
    .corridor-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }
    .corridor-title {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 2px;
    }
    .priority-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(239, 68, 68, 0.2);
      border: 1px solid rgba(239, 68, 68, 0.5);
      border-radius: 20px;
      color: #ef4444;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 1px;
    }
    .coordination-grid {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 14px;
    }
    .coord-item {
      padding: 12px 14px;
      background: rgba(30, 41, 59, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      text-align: center;
    }
    .coord-title {
      font-size: 28px;
      color: #94a3b8;
      margin-bottom: 4px;
      font-weight: 600;
    }
    .coord-val {
      font-size: 30px;
      font-weight: 700;
      color: #06b6d4;
    }

    /* Central Command Radar Node */
    .command-node {
      position: absolute;
      top: 540px;
      right: 80px;
      padding: 14px 24px;
      background: rgba(15, 23, 42, 0.92);
      border: 1px solid rgba(6, 182, 212, 0.5);
      border-radius: 10px;
      color: #06b6d4;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      z-index: 25;
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.3);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div class="scene-container" data-composition-id="scene7">
    <img id="bgImage" class="bg-img" src="../assets/images/shot7.jpg" alt="Emergency City Map">

    <div class="title-group" id="titleGroup">
      <div class="accent-bar" id="accentBar"></div>
      <div class="category-badge" id="catBadge">RAPID TRANSIT</div>
      <h1 class="main-title" id="mainTitle">EMERGENCY <span>GREEN CORRIDOR</span></h1>
    </div>

    <!-- Central Command Node Badge -->
    <div class="command-node" id="cmdNode">
      <span>CENTRAL CONTROL ROOM</span>
    </div>

    <!-- SVG Route Map Overlay -->
    <svg class="svg-layer" viewBox="0 0 1080 1920">
      <defs>
        <filter id="glow-green">
          <feGaussianBlur stdDeviation="5" result="blur"/>
          <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
          </feMerge>
        </filter>
      </defs>

      <!-- Corridor Line Path along Avenue -->
      <path id="routeLine" d="M 280 1480 L 520 1150 L 760 820" fill="none" stroke="#10b981" stroke-width="8" stroke-dasharray="14,8" opacity="0" filter="url(#glow-green)"/>

      <!-- Control Room link line -->
      <path id="controlBeam" d="M 850 610 L 520 1150" fill="none" stroke="#06b6d4" stroke-width="3" stroke-dasharray="6,4" opacity="0"/>

      <!-- Moving Ambulance Node -->
      <g id="ambulanceNode" opacity="0" data-layout-ignore>
        <circle cx="280" cy="1480" r="24" fill="rgba(239, 68, 68, 0.3)" filter="url(#glow-green)"/>
        <circle cx="280" cy="1480" r="14" fill="#ef4444"/>
        <text x="280" y="1486" text-anchor="middle" fill="#ffffff" font-size="14" font-weight="bold" data-layout-ignore>AMB</text>
      </g>
    </svg>

    <!-- Corridor Control Panel -->
    <div class="corridor-panel" id="corridorPanel">
      <div class="corridor-header">
        <div class="corridor-title">TRAFFIC POLICE COORDINATION</div>
        <div class="priority-badge">PRIORITY LEVEL 1</div>
      </div>
      <div class="coordination-grid">
        <div class="coord-item">
          <div class="coord-title">TELEMETRY</div>
          <div class="coord-val">LIVE GPS</div>
        </div>
        <div class="coord-item">
          <div class="coord-title">SIGNALS</div>
          <div class="coord-val" style="color: #10b981;">ALL GREEN</div>
        </div>
        <div class="coord-item">
          <div class="coord-title">CLEARANCE</div>
          <div class="coord-val">SECURED</div>
        </div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene7"] = tl;

    // Camera slow zoom
    tl.fromTo("#bgImage", 
      { scale: 1.0, y: 0 }, 
      { scale: 1.12, y: -25, duration: 10.50, ease: "none" }, 0
    );

    // Title reveal
    tl.fromTo("#accentBar", { width: 0, opacity: 0 }, { width: 60, opacity: 1, duration: 0.35 }, 0.2);
    tl.fromTo("#catBadge", { y: -15, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, 0.35);
    tl.fromTo("#mainTitle", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.5);

    // Route line & corridor panel pop-in (sync with "emergency vehicles get green corridors", ~1.5s - 4.5s)
    tl.fromTo("#routeLine", { opacity: 0 }, { opacity: 1, duration: 0.6 }, 1.5);
    tl.fromTo("#ambulanceNode", { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.4, ease: "back.out(1.5)" }, 1.8);
    tl.fromTo("#corridorPanel", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "back.out(1.3)" }, 2.2);

    // Ambulance travels along route
    tl.to("#ambulanceNode", {
      x: 240,
      y: -330,
      duration: 3.5,
      ease: "power1.inOut"
    }, 2.5);

    // Command Room beam connects to junction (sync with "central control room", ~5.0s - 7.5s)
    tl.fromTo("#cmdNode", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 5.0);
    tl.fromTo("#controlBeam", { opacity: 0 }, { opacity: 0.8, duration: 0.5 }, 5.4);

    // Continue ambulance along remaining corridor to destination
    tl.to("#ambulanceNode", {
      x: 480,
      y: -660,
      duration: 3.5,
      ease: "power1.inOut"
    }, 6.5);
  </script>
</body>
</html>
