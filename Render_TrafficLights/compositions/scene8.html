<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 8 - Hyderabad Ending & CTA</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('../assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0a0b10;
      font-family: 'Oswald', -apple-system, sans-serif;
    }
    .scene-container {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 50%;
    }

    /* Top-Left Safe Zone Title */
    .title-group {
      position: absolute;
      top: 140px;
      left: 70px;
      z-index: 20;
    }
    .accent-bar {
      width: 60px;
      height: 4px;
      background: #f59e0b;
      margin-bottom: 16px;
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(245, 158, 11, 0.7);
    }
    .category-badge {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(245, 158, 11, 0.4);
      color: #f59e0b;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }
    .main-title {
      font-size: 54px;
      font-weight: 700;
      line-height: 1.1;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
    }

    /* Center-Bottom Question & CTA (Strictly above bottom 580px) */
    .cta-card {
      position: absolute;
      bottom: 600px;
      left: 70px;
      right: 70px;
      padding: 36px 32px;
      background: rgba(11, 15, 25, 0.94);
      border: 1px solid rgba(245, 158, 11, 0.5);
      border-radius: 20px;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.85), 0 0 30px rgba(245, 158, 11, 0.25);
      backdrop-filter: blur(14px);
      text-align: center;
      z-index: 25;
    }
    .question-headline {
      font-size: 46px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      margin-bottom: 24px;
      text-shadow: 0 2px 15px rgba(0,0,0,0.8);
    }
    .question-headline span {
      color: #06b6d4;
      text-shadow: 0 0 25px rgba(6, 182, 212, 0.6);
    }

    /* Comment Below Pill Badge */
    .comment-pill {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 14px;
      padding: 18px 40px;
      background: #0f172a;
      border: 3px solid #f59e0b;
      color: #fbbf24;
      font-size: 34px;
      font-weight: 800;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 40px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6), 0 0 25px rgba(245, 158, 11, 0.4);
    }
    .comment-icon {
      font-size: 32px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div class="scene-container" data-composition-id="scene8">
    <img id="bgImage" class="bg-img" src="../assets/images/shot8.jpg" alt="Charminar Twilight Junction">

    <div class="title-group" id="titleGroup">
      <div class="accent-bar" id="accentBar"></div>
      <div class="category-badge" id="catBadge">YOUR CITY • YOUR VOICE</div>
      <h1 class="main-title" id="mainTitle">SMARTER JUNCTIONS</h1>
    </div>

    <!-- Center-Bottom Question & CTA (Above 580px bottom safe zone) -->
    <div class="cta-card" id="ctaCard">
      <div class="question-headline" id="qHeadline">
        WHICH JUNCTION NEAR YOU NEEDS A <span>SMARTER LIGHT?</span>
      </div>
      <div class="comment-pill" id="commentPill">
        <span class="comment-icon">💬</span>
        <span>COMMENT BELOW</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene8"] = tl;

    // Gentle camera pull-back
    tl.fromTo("#bgImage", 
      { scale: 1.15, y: -15 }, 
      { scale: 1.03, y: 0, duration: 4.83, ease: "none" }, 0
    );

    // Title reveal
    tl.fromTo("#accentBar", { width: 0, opacity: 0 }, { width: 60, opacity: 1, duration: 0.35 }, 0.2);
    tl.fromTo("#catBadge", { y: -15, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, 0.35);
    tl.fromTo("#mainTitle", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.5);

    // Question card pop-in (sync with "Which junction near you...", ~0.8s)
    tl.fromTo("#ctaCard", 
      { scale: 0.8, opacity: 0 }, 
      { scale: 1.0, opacity: 1, duration: 0.5, ease: "back.out(1.4)" }, 0.8
    );

    // Comment Below badge pulse (appears at 1.8s, holds for >2.8s)
    tl.fromTo("#commentPill", 
      { scale: 0.85, opacity: 0 }, 
      { scale: 1.05, opacity: 1, duration: 0.4, ease: "back.out(1.6)" }, 1.8
    );
    tl.to("#commentPill", { scale: 1.0, duration: 0.25, ease: "power1.inOut" }, 2.2);
    tl.to("#commentPill", {
      boxShadow: "0 15px 40px rgba(245, 158, 11, 0.8)",
      repeat: 3,
      yoyo: true,
      duration: 0.5
    }, 2.5);
  </script>
</body>
</html>
