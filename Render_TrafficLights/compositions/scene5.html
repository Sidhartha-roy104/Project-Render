<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 5 - Overhead Cameras & AI Vision</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('../assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0a0b10;
      font-family: 'Oswald', -apple-system, sans-serif;
    }
    .scene-container {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 50%;
    }

    /* Top-Left Title */
    .title-group {
      position: absolute;
      top: 140px;
      left: 70px;
      z-index: 20;
    }
    .accent-bar {
      width: 60px;
      height: 4px;
      background: #06b6d4;
      margin-bottom: 16px;
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.7);
    }
    .category-badge {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #06b6d4;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }
    .main-title {
      font-size: 60px;
      font-weight: 700;
      line-height: 1.1;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
    }
    .main-title span {
      color: #06b6d4;
      text-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
    }

    /* SVG Scanning Cone & Detection Boxes */
    .svg-layer {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
      z-index: 15;
    }

    /* HUD Metrics Overlay */
    .hud-card {
      position: absolute;
      top: 380px;
      right: 70px;
      padding: 20px 24px;
      background: rgba(11, 15, 25, 0.92);
      border: 1px solid rgba(6, 182, 212, 0.5);
      border-radius: 14px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(10px);
      z-index: 25;
      display: flex;
      flex-direction: column;
      gap: 12px;
      min-width: 280px;
    }
    .hud-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 28px;
      font-weight: 600;
      color: #94a3b8;
    }
    .hud-val {
      font-size: 34px;
      font-weight: 700;
      color: #06b6d4;
      letter-spacing: 1px;
    }
    .hud-val.alert {
      color: #f59e0b;
    }

    /* Queue Length Meter Bar */
    .queue-meter {
      position: absolute;
      bottom: 240px;
      left: 70px;
      right: 70px;
      padding: 24px 30px;
      background: rgba(11, 15, 25, 0.94);
      border: 1px solid rgba(6, 182, 212, 0.4);
      border-radius: 16px;
      backdrop-filter: blur(12px);
      z-index: 25;
      box-shadow: 0 15px 40px rgba(0, 0, 0, 0.8);
    }
    .queue-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    .queue-title {
      font-size: 28px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 2px;
    }
    .queue-bar-bg {
      height: 22px;
      background: #1e293b;
      border-radius: 11px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
    }
    .queue-bar-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #06b6d4, #f59e0b);
      border-radius: 11px;
      box-shadow: 0 0 12px rgba(6, 182, 212, 0.8);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div class="scene-container" data-composition-id="scene5">
    <img id="bgImage" class="bg-img" src="../assets/images/shot5.jpg" alt="Overhead Camera Junction">

    <div class="title-group" id="titleGroup">
      <div class="accent-bar" id="accentBar"></div>
      <div class="category-badge" id="catBadge">OPTICAL ESTIMATION</div>
      <h1 class="main-title" id="mainTitle">AI COMPUTER <span>VISION</span></h1>
    </div>

    <!-- HUD Metrics Card -->
    <div class="hud-card" id="hudCard">
      <div class="hud-row">
        <span>DETECTED UNITS</span>
        <span class="hud-val" id="unitCount">0</span>
      </div>
      <div class="hud-row">
        <span>CONGESTION LEVEL</span>
        <span class="hud-val alert">HIGH (78%)</span>
      </div>
    </div>

    <!-- SVG Layer for Camera Scan & Bounding Boxes -->
    <svg class="svg-layer" viewBox="0 0 1080 1920">
      <defs>
        <linearGradient id="scanGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
          <stop offset="100%" stop-color="#06b6d4" stop-opacity="0.0"/>
        </linearGradient>
      </defs>

      <!-- Camera Scan Cone originating from upper gantry (approx x: 260, y: 460) -->
      <polygon id="scanCone" points="260,460 120,1500 960,1500" fill="url(#scanGrad)" opacity="0"/>

      <!-- Vehicle Bounding Boxes -->
      <!-- Auto Rickshaw 1 -->
      <g id="box1" opacity="0" data-layout-ignore>
        <rect x="420" y="1120" width="120" height="95" fill="rgba(6,182,212,0.18)" stroke="#06b6d4" stroke-width="3" rx="4"/>
        <text x="425" y="1110" fill="#06b6d4" font-size="24" font-weight="bold" data-layout-ignore>AUTO #01</text>
      </g>
      <!-- Car 1 -->
      <g id="box2" opacity="0" data-layout-ignore>
        <rect x="560" y="1040" width="170" height="125" fill="rgba(6,182,212,0.18)" stroke="#06b6d4" stroke-width="3" rx="4"/>
        <text x="565" y="1030" fill="#06b6d4" font-size="24" font-weight="bold" data-layout-ignore>CAR #02</text>
      </g>
      <!-- Auto Rickshaw 2 -->
      <g id="box3" opacity="0" data-layout-ignore>
        <rect x="360" y="1260" width="130" height="100" fill="rgba(6,182,212,0.18)" stroke="#06b6d4" stroke-width="3" rx="4"/>
        <text x="365" y="1250" fill="#06b6d4" font-size="24" font-weight="bold" data-layout-ignore>AUTO #03</text>
      </g>
      <!-- Motorbike -->
      <g id="box4" opacity="0" data-layout-ignore>
        <rect x="680" y="1220" width="85" height="90" fill="rgba(6,182,212,0.18)" stroke="#06b6d4" stroke-width="3" rx="4"/>
        <text x="685" y="1210" fill="#06b6d4" font-size="24" font-weight="bold" data-layout-ignore>MOTO #04</text>
      </g>
    </svg>

    <!-- Queue Length Bar -->
    <div class="queue-meter" id="queueMeter">
      <div class="queue-header">
        <span class="queue-title">REAL-TIME QUEUE LENGTH</span>
        <span class="queue-title" style="color: #f59e0b;" id="queueNum">0m</span>
      </div>
      <div class="queue-bar-bg">
        <div class="queue-bar-fill" id="queueBarFill"></div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene5"] = tl;

    // Camera slow pan
    tl.fromTo("#bgImage", 
      { scale: 1.05, y: -10 }, 
      { scale: 1.15, y: 15, duration: 5.08, ease: "none" }, 0
    );

    // Title reveal
    tl.fromTo("#accentBar", { width: 0, opacity: 0 }, { width: 60, opacity: 1, duration: 0.35 }, 0.2);
    tl.fromTo("#catBadge", { y: -15, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, 0.35);
    tl.fromTo("#mainTitle", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.5);

    // Camera Scan Cone sweep (~1.0s)
    tl.fromTo("#scanCone", 
      { opacity: 0, scaleY: 0.2, transformOrigin: "260px 460px" }, 
      { opacity: 0.8, scaleY: 1, duration: 0.8, ease: "power2.out" }, 1.0
    );

    // HUD Card pop-in (~1.8s)
    tl.fromTo("#hudCard", { scale: 0.8, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, ease: "back.out(1.4)" }, 1.8);
    tl.fromTo("#queueMeter", { y: 30, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.3)" }, 2.0);

    // Bounding Boxes snap in (sync with "computer vision to estimate queues", ~2.4s - 3.8s)
    tl.fromTo("#box1", { scale: 0.8, opacity: 0, transformOrigin: "center" }, { scale: 1, opacity: 1, duration: 0.25 }, 2.4);
    tl.add(() => { document.getElementById("unitCount").innerText = "4"; }, 2.5);

    tl.fromTo("#box2", { scale: 0.8, opacity: 0, transformOrigin: "center" }, { scale: 1, opacity: 1, duration: 0.25 }, 2.8);
    tl.add(() => { document.getElementById("unitCount").innerText = "8"; }, 2.9);

    tl.fromTo("#box3", { scale: 0.8, opacity: 0, transformOrigin: "center" }, { scale: 1, opacity: 1, duration: 0.25 }, 3.2);
    tl.fromTo("#box4", { scale: 0.8, opacity: 0, transformOrigin: "center" }, { scale: 1, opacity: 1, duration: 0.25 }, 3.4);
    tl.add(() => { document.getElementById("unitCount").innerText = "14"; }, 3.5);

    // Queue meter fills to 78m
    tl.to("#queueBarFill", { width: "75%", duration: 1.5, ease: "power2.out" }, 2.5);
    tl.to({ val: 0 }, {
      val: 78,
      duration: 1.5,
      ease: "power2.out",
      onUpdate: function() {
        document.getElementById("queueNum").innerText = Math.round(this.targets()[0].val) + "m";
      }
    }, 2.5);
  </script>
</body>
</html>
