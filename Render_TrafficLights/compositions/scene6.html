<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 6 - Adaptive Green Signals</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('../assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #0a0b10;
      font-family: 'Oswald', -apple-system, sans-serif;
    }
    .scene-container {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 50%;
    }

    /* Top-Left Title */
    .title-group {
      position: absolute;
      top: 140px;
      left: 70px;
      z-index: 20;
    }
    .accent-bar {
      width: 60px;
      height: 4px;
      background: #10b981;
      margin-bottom: 16px;
      border-radius: 2px;
      box-shadow: 0 0 12px rgba(16, 185, 129, 0.7);
    }
    .category-badge {
      display: inline-block;
      padding: 8px 16px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(16, 185, 129, 0.4);
      color: #10b981;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 12px;
      backdrop-filter: blur(8px);
    }
    .main-title {
      font-size: 60px;
      font-weight: 700;
      line-height: 1.1;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 4px 20px rgba(0, 0, 0, 0.85);
    }
    .main-title span {
      color: #10b981;
      text-shadow: 0 0 25px rgba(16, 185, 129, 0.7);
    }

    /* Adaptive Control Dashboard */
    .adaptive-panel {
      position: absolute;
      bottom: 240px;
      left: 70px;
      right: 70px;
      padding: 30px;
      background: rgba(11, 15, 25, 0.94);
      border: 1px solid rgba(16, 185, 129, 0.5);
      border-radius: 16px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 25px rgba(16, 185, 129, 0.2);
      backdrop-filter: blur(12px);
      z-index: 25;
    }
    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }
    .panel-title {
      font-size: 28px;
      font-weight: 700;
      letter-spacing: 2px;
      color: #f1f5f9;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .illustrative-tag {
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 1px;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.1);
      padding: 4px 12px;
      border-radius: 4px;
    }
    .mode-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 16px;
      background: rgba(16, 185, 129, 0.2);
      border: 1px solid rgba(16, 185, 129, 0.5);
      border-radius: 20px;
      color: #10b981;
      font-size: 28px;
      font-weight: 700;
    }

    /* Dynamic Stretch Bar Section */
    .bar-group {
      margin-bottom: 22px;
    }
    .bar-label-row {
      display: flex;
      justify-content: space-between;
      font-size: 28px;
      font-weight: 600;
      color: #cbd5e1;
      margin-bottom: 10px;
    }
    .bar-bg {
      height: 32px;
      background: #1e293b;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.6);
      position: relative;
    }
    .bar-stretch {
      height: 100%;
      width: 35%;
      background: linear-gradient(90deg, #059669, #10b981);
      border-radius: 16px;
      box-shadow: 0 0 15px rgba(16, 185, 129, 0.8);
      position: relative;
    }
    .bar-shorten {
      height: 100%;
      width: 70%;
      background: linear-gradient(90deg, #d97706, #ef4444);
      border-radius: 16px;
    }

    /* Live Demand Metric */
    .demand-footer {
      display: flex;
      justify-content: space-between;
      padding-top: 16px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      font-size: 28px;
      font-weight: 600;
      color: #94a3b8;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div class="scene-container" data-composition-id="scene6">
    <img id="bgImage" class="bg-img" src="../assets/images/shot6.jpg" alt="Adaptive Green Flow">

    <div class="title-group" id="titleGroup">
      <div class="accent-bar" id="accentBar"></div>
      <div class="category-badge" id="catBadge">DYNAMIC TIMING</div>
      <h1 class="main-title" id="mainTitle">ADAPTIVE <span>GREEN LIGHT</span></h1>
    </div>

    <!-- Adaptive Control Dashboard -->
    <div class="adaptive-panel" id="adaptivePanel">
      <div class="panel-header">
        <div class="panel-title">
          <span>ADAPTIVE DEMAND LOGIC</span>
          <span class="illustrative-tag" data-layout-ignore>ILLUSTRATIVE</span>
        </div>
        <div class="mode-badge">LIVE OPTIMIZED</div>
      </div>

      <!-- Busy Approach: Green Time Stretches -->
      <div class="bar-group">
        <div class="bar-label-row">
          <span>HIGH-TRAFFIC MAIN ROAD</span>
          <span id="stretchVal" style="color: #10b981; font-weight: 700;">+35s EXTENSION</span>
        </div>
        <div class="bar-bg">
          <div class="bar-stretch" id="stretchBar"></div>
        </div>
      </div>

      <!-- Empty Cross Street: Green Time Shortens -->
      <div class="bar-group">
        <div class="bar-label-row">
          <span>LOW-TRAFFIC SIDE STREET</span>
          <span id="shortenVal" style="color: #ef4444; font-weight: 700;">-25s TRUNCATED</span>
        </div>
        <div class="bar-bg">
          <div class="bar-shorten" id="shortenBar"></div>
        </div>
      </div>

      <div class="demand-footer">
        <span>STATUS: GREEN WAVE ACTIVE</span>
        <span style="color: #06b6d4;">VEHICLE CLEARANCE: OPTIMAL</span>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene6"] = tl;

    // Smooth forward push
    tl.fromTo("#bgImage", 
      { scale: 1.05, y: -10 }, 
      { scale: 1.15, y: 15, duration: 5.40, ease: "none" }, 0
    );

    // Title reveal
    tl.fromTo("#accentBar", { width: 0, opacity: 0 }, { width: 60, opacity: 1, duration: 0.35 }, 0.2);
    tl.fromTo("#catBadge", { y: -15, opacity: 0 }, { y: 0, opacity: 1, duration: 0.3, ease: "back.out(1.4)" }, 0.35);
    tl.fromTo("#mainTitle", { y: 20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4 }, 0.5);

    // Panel pop-in (~1.0s)
    tl.fromTo("#adaptivePanel", 
      { y: 50, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.5, ease: "back.out(1.3)" }, 1.0
    );

    // Dynamic bar STRETCH (sync with "stretch green time", ~2.0s - 3.5s)
    tl.fromTo("#stretchBar", { width: "35%" }, { width: "85%", duration: 1.4, ease: "power2.out" }, 2.0);

    // Dynamic bar SHORTEN (sync with "or shorten green time based on demand", ~3.4s - 4.8s)
    tl.fromTo("#shortenBar", { width: "70%" }, { width: "25%", duration: 1.3, ease: "power2.out" }, 3.4);
  </script>
</body>
</html>
