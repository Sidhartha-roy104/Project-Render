<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 1</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
    .bg-img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    .title-box {
      position: absolute;
      top: 160px;
      left: 120px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sub-title {
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 2px 10px #000, 0 4px 20px #000;
    }
    .main-title {
      font-size: 82px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1.05;
      filter: drop-shadow(0 4px 15px rgba(0,0,0,0.95)) drop-shadow(0 0 30px rgba(0,0,0,0.9));
    }
    .color-red {
      color: #ff6666;
      text-shadow: 0 0 20px rgba(255, 102, 102, 0.9), 0 3px 6px #000;
    }
    .color-gold {
      color: #ffd000;
      text-shadow: 0 0 20px rgba(255, 208, 0, 0.9), 0 3px 6px #000;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="root" class="clip" data-composition-id="scene1" data-width="1080" data-height="1920" data-start="0" data-duration="3.76">
    <img id="bg" class="bg-img" src="assets/images/shot1.jpg" alt="Cracked pot leaking water">

    <!-- Beat 1: Your energy is LEAKING -->
    <div id="title1" class="title-box">
      <div class="sub-title">YOUR ENERGY IS</div>
      <div id="wordLeaking" class="main-title color-red">LEAKING</div>
    </div>

    <!-- Beat 2: And the Gita says WHERE? -->
    <div id="title2" class="title-box">
      <div class="sub-title">AND THE GITA SAYS</div>
      <div id="wordWhere" class="main-title color-gold">WHERE?</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene1"] = tl;

    // Initial state
    gsap.set("#title1", { opacity: 0 });
    gsap.set("#title2", { opacity: 0 });
    gsap.set("#wordLeaking", { opacity: 0, scale: 0.9 });
    gsap.set("#wordWhere", { opacity: 0, scale: 0.9 });

    // Slow push-in
    tl.fromTo("#bg", { scale: 1.0 }, { scale: 1.08, duration: 3.76, ease: "none" }, 0);

    // Title 1: "YOUR ENERGY IS" reveals at 0.11s
    tl.to("#title1", { opacity: 1, duration: 0.15 }, 0.11);
    // "LEAKING" strikes at 1.08s
    tl.to("#wordLeaking", { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 1.08);

    // Transition to Title 2 at 2.01s ("And the Gita says, where?")
    tl.to("#title1", { opacity: 0, duration: 0.15 }, 1.95);
    tl.to("#title2", { opacity: 1, duration: 0.15 }, 2.01);
    tl.to("#wordWhere", { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 3.04);
  </script>
</body>
</html>
