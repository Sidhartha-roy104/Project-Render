<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 5</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
    .bg-img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    .cta-box {
      position: absolute;
      top: 480px;
      left: 80px;
      right: 80px;
      z-index: 15;
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 28px;
    }
    .cta-question {
      font-size: 56px;
      font-weight: 900;
      color: #fff;
      text-transform: uppercase;
      line-height: 1.25;
      letter-spacing: 2px;
      text-shadow: 0 4px 25px rgba(0, 0, 0, 0.9);
    }
    .highlight-gold {
      color: #ffcc00;
      text-shadow: 0 0 25px rgba(255, 204, 0, 0.8), 0 0 50px rgba(255, 204, 0, 0.4);
    }
    .comment-badge {
      background: rgba(255, 51, 51, 0.9);
      border: 2px solid #ff8888;
      border-radius: 50px;
      padding: 16px 42px;
      font-size: 40px;
      font-weight: 800;
      color: #fff;
      letter-spacing: 3px;
      text-transform: uppercase;
      box-shadow: 0 10px 30px rgba(255, 51, 51, 0.5), 0 0 40px rgba(255, 51, 51, 0.3);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="root" class="clip" data-composition-id="scene5" data-width="1080" data-height="1920" data-start="0" data-duration="2.92">
    <img id="bg" class="bg-img" src="assets/images/shot5.jpg" alt="Diya with ending question">

    <div id="cta" class="cta-box">
      <div class="cta-question">
        WHICH HABIT <span class="highlight-gold">DRAINS YOU</span> MOST?
      </div>
      <div id="badge" class="comment-badge">
        COMMENT BELOW ↓
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene5"] = tl;

    // Initial state
    gsap.set("#cta", { opacity: 0 });
    gsap.set("#badge", { scale: 0.9 });

    // Slow push-in
    tl.fromTo("#bg", { scale: 1.04 }, { scale: 1.12, duration: 2.92, ease: "none" }, 0);

    // CTA Reveal
    tl.to("#cta", { opacity: 1, duration: 0.25 }, 0.11);
    tl.to("#badge", { scale: 1, duration: 0.25, ease: "back.out(2)" }, 0.8);
  </script>
</body>
</html>
