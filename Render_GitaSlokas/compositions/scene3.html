<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 3</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 1080px; height: 1920px; overflow: hidden; background: #000; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    #root { width: 1080px; height: 1920px; position: relative; overflow: hidden; }
    .bg-img {
      position: absolute;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: center center;
    }
    .title-box {
      position: absolute;
      top: 160px;
      left: 120px;
      z-index: 10;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .sub-title {
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 4px;
      text-shadow: 0 2px 10px #000, 0 4px 20px #000;
    }
    .main-title {
      font-size: 80px;
      font-weight: 900;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1.05;
      filter: drop-shadow(0 4px 15px rgba(0,0,0,0.95)) drop-shadow(0 0 30px rgba(0,0,0,0.9));
    }
    .color-gold {
      color: #ffd000;
      text-shadow: 0 0 20px rgba(255, 208, 0, 0.9), 0 3px 6px #000;
    }
    .color-red {
      color: #ff6666;
      text-shadow: 0 0 20px rgba(255, 102, 102, 0.9), 0 3px 6px #000;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="root" class="clip" data-composition-id="scene3" data-width="1080" data-height="1920" data-start="0" data-duration="6.36">
    <img id="bg" class="bg-img" src="assets/images/shot3.jpg" alt="Brass balance scale">

    <!-- Beat 1: Not extreme. BALANCED -->
    <div id="beat1" class="title-box">
      <div class="sub-title">NOT EXTREME</div>
      <div id="wordBalanced" class="main-title color-gold">BALANCED</div>
    </div>

    <!-- Beat 2: No BURNOUT -->
    <div id="beat2" class="title-box">
      <div class="sub-title">NO</div>
      <div class="main-title color-red">BURNOUT</div>
    </div>

    <!-- Beat 3: No ALL-NIGHTERS -->
    <div id="beat3" class="title-box">
      <div class="sub-title">NO</div>
      <div class="main-title color-red">ALL-NIGHTERS</div>
    </div>

    <!-- Beat 4: No ENDLESS SCROLLING -->
    <div id="beat4" class="title-box">
      <div class="sub-title">NO</div>
      <div class="main-title color-red" style="font-size: 70px;">ENDLESS SCROLLING</div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene3"] = tl;

    // Initial states
    gsap.set(["#beat1", "#beat2", "#beat3", "#beat4"], { opacity: 0 });
    gsap.set("#wordBalanced", { opacity: 0, scale: 0.9 });

    // Slow push-in
    tl.fromTo("#bg", { scale: 1.0 }, { scale: 1.08, duration: 6.36, ease: "none" }, 0);

    // Beat 1: "Not extreme" (t=0.10s) -> "BALANCED" (t=1.31s)
    tl.to("#beat1", { opacity: 1, duration: 0.15 }, 0.10);
    tl.to("#wordBalanced", { opacity: 1, scale: 1, duration: 0.18, ease: "back.out(2)" }, 1.31);

    // Beat 2: "No burnout" (t=2.53s)
    tl.to("#beat1", { opacity: 0, duration: 0.1 }, 2.45);
    tl.to("#beat2", { opacity: 1, duration: 0.15 }, 2.53);

    // Beat 3: "No all-nighters" (t=3.48s)
    tl.to("#beat2", { opacity: 0, duration: 0.1 }, 3.40);
    tl.to("#beat3", { opacity: 1, duration: 0.15 }, 3.48);

    // Beat 4: "No endless scrolling" (t=4.61s)
    tl.to("#beat3", { opacity: 0, duration: 0.1 }, 4.55);
    tl.to("#beat4", { opacity: 1, duration: 0.15 }, 4.61);
  </script>
</body>
</html>
