<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>How Does Your Phone Know Where You Are? — GPS Explainer</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
      font-display: swap;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #060913;
      font-family: 'Oswald', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #root {
      width: 1080px;
      height: 1920px;
      position: relative;
      overflow: hidden;
      background: #060913;
    }
    .clip {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
    }

    /* Subtle Cinematic Vignette Overlay across scenes */
    #cinematicOverlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 1080px;
      height: 1920px;
      pointer-events: none;
      z-index: 100;
    }
    .vignette {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 50%, transparent 65%, rgba(4, 7, 16, 0.6) 100%);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="main" data-width="1080" data-height="1920">
    <!-- Master Audio Track (-15.9 LUFS integrated, sidechain ducked BGM + VO + SFX) -->
    <audio id="master-audio" src="assets/audio/audio_final.mp3" data-start="0" data-duration="33.55"></audio>

    <!-- 7 Modular Compositions (Synchronized with speech transcript) -->
    <div id="scene1-host" class="clip" data-composition-id="scene1" data-composition-src="compositions/scene1.html" data-start="0.00" data-duration="6.20"></div>
    <div id="scene2-host" class="clip" data-composition-id="scene2" data-composition-src="compositions/scene2.html" data-start="6.20" data-duration="3.26"></div>
    <div id="scene3-host" class="clip" data-composition-id="scene3" data-composition-src="compositions/scene3.html" data-start="9.46" data-duration="4.00"></div>
    <div id="scene4-host" class="clip" data-composition-id="scene4" data-composition-src="compositions/scene4.html" data-start="13.46" data-duration="5.68"></div>
    <div id="scene5-host" class="clip" data-composition-id="scene5" data-composition-src="compositions/scene5.html" data-start="19.14" data-duration="6.36"></div>
    <div id="scene6-host" class="clip" data-composition-id="scene6" data-composition-src="compositions/scene6.html" data-start="25.50" data-duration="2.00"></div>
    <div id="scene7-host" class="clip" data-composition-id="scene7" data-composition-src="compositions/scene7.html" data-start="27.50" data-duration="6.05"></div>

    <!-- Cinematic Overlay -->
    <div id="cinematicOverlay">
      <div class="vignette"></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    window.__timelines["main"] = gsap.timeline({ paused: true });
  </script>
</body>
</html>
