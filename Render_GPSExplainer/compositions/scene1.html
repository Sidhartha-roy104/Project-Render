<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 1 — Hook & Question</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('../assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #060913;
      font-family: 'Oswald', -apple-system, sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .video-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 45%;
    }

    /* Gradient overlay to increase typography readability at top/bottom while leaving speaker clear */
    .lighting-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(6, 10, 22, 0.75) 0%,
        rgba(6, 10, 22, 0.15) 25%,
        rgba(6, 10, 22, 0.10) 65%,
        rgba(6, 10, 22, 0.85) 100%
      );
      pointer-events: none;
    }

    /* Top Safe-Zone Header (y: 160px to 380px) */
    .title-group {
      position: absolute;
      top: 170px;
      left: 70px;
      right: 70px;
      z-index: 20;
    }
    .accent-bar {
      width: 60px;
      height: 4px;
      background: #00e5ff;
      margin-bottom: 16px;
      border-radius: 2px;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.8);
    }
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(10, 20, 38, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.5);
      color: #00e5ff;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e5ff;
    }
    .main-title {
      font-size: 68px;
      font-weight: 700;
      line-height: 1.12;
      color: #ffffff;
      text-transform: uppercase;
      letter-spacing: 1px;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
    }
    .main-title span {
      color: #00e5ff;
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
    }

    /* Telemetry HUD in top right */
    .hud-telemetry {
      position: absolute;
      top: 180px;
      right: 70px;
      text-align: right;
      z-index: 20;
      font-family: monospace;
      color: rgba(255, 255, 255, 0.8);
      font-size: 28px;
      line-height: 1.4;
      background: rgba(6, 12, 28, 0.7);
      padding: 10px 18px;
      border-left: 3px solid #00e5ff;
      border-radius: 4px;
      backdrop-filter: blur(6px);
    }
    .hud-telemetry .coords {
      color: #00e5ff;
      font-weight: bold;
    }

    /* Bottom Hook Banner (Placed at bottom of video, completely clear of face) */
    .hook-callout {
      position: absolute;
      bottom: 80px;
      left: 60px;
      right: 60px;
      padding: 22px 30px;
      background: rgba(8, 16, 36, 0.92);
      border: 1px solid rgba(0, 229, 255, 0.5);
      border-left: 6px solid #00e5ff;
      border-radius: 10px;
      backdrop-filter: blur(14px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.7);
      z-index: 20;
    }
    .hook-text {
      font-size: 34px;
      font-weight: 600;
      color: #ffffff;
      letter-spacing: 1px;
      line-height: 1.25;
      text-transform: uppercase;
    }
    .hook-text em {
      font-style: normal;
      color: #ffb300;
      text-shadow: 0 0 12px rgba(255, 179, 0, 0.5);
    }


  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="scene1">
    <video id="talkingHead" class="video-bg" src="../assets/videos/talking_head_scene1.mp4" muted playsinline data-start="0" data-duration="6.20"></video>
    <div class="lighting-overlay"></div>

    <!-- Top Left Title -->
    <div class="title-group" id="titleGroup">
      <div class="accent-bar" id="accentBar"></div>
      <div class="category-badge" id="catBadge">
        <span class="status-dot"></span>
        <span>TECH EXPLAINER // GPS</span>
      </div>
      <h1 class="main-title" id="mainTitle">
        HOW DOES YOUR PHONE<br>
        <span>KNOW WHERE YOU ARE?</span>
      </h1>
    </div>

    <!-- Top Right Telemetry HUD -->
    <div class="hud-telemetry" id="hudTelemetry">
      <div>GNSS STATUS: <span style="color:#22c55e;">ACQUIRING</span></div>
      <div>FIX: <span class="coords">17.3850° N, 78.4867° E</span></div>
    </div>

    <!-- Bottom Hook Callout (Safe zone at bottom of video) -->
    <div class="hook-callout" id="hookCallout">
      <div class="hook-text">
        IT DOESN'T GUESS. <em>IT CALCULATES.</em>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene1"] = tl;

    // Subtle video zoom/push
    tl.fromTo("#talkingHead", 
      { scale: 1.0 }, 
      { scale: 1.05, duration: 6.20, ease: "none" }, 0
    );

    // Header reveal (0.1s - 0.9s)
    tl.fromTo("#accentBar", { width: 0, opacity: 0 }, { width: 60, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.1);
    tl.fromTo("#catBadge", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.4, ease: "back.out(1.5)" }, 0.25);
    tl.fromTo("#mainTitle", { y: 25, opacity: 0 }, { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 0.4);
    tl.fromTo("#hudTelemetry", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.5);

    // Hook callout pops in when narration says "Ever wondered how your phone knows exactly..." (~3.2s)
    tl.fromTo("#hookCallout", 
      { y: 30, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 3.0
    );
  </script>
</body>
</html>
