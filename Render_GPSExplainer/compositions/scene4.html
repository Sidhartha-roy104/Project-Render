<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 4 — Trilateration & GPS Reveal</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('../assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #060913;
      font-family: 'Oswald', -apple-system, sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 50%;
    }
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 50%, transparent 40%, rgba(4, 8, 20, 0.75) 100%);
      pointer-events: none;
    }

    /* Top Left Title Group */
    .title-group {
      position: absolute;
      top: 170px;
      left: 70px;
      right: 70px;
      z-index: 20;
    }
    .accent-bar {
      width: 60px;
      height: 4px;
      background: #00e5ff;
      margin-bottom: 16px;
      border-radius: 2px;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.8);
    }
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(10, 20, 38, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.5);
      color: #00e5ff;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e5ff;
    }
    .main-title {
      font-size: 68px;
      font-weight: 700;
      line-height: 1.12;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
    }
    .main-title span {
      color: #00e5ff;
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
    }

    /* Target Reticle at Trilateration Center */
    .intersection-target {
      position: absolute;
      top: 920px;
      left: 540px;
      transform: translate(-50%, -50%);
      width: 200px;
      height: 200px;
      pointer-events: none;
      z-index: 15;
    }
    .target-ring {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 2px solid #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 20px rgba(0, 229, 255, 0.8);
    }
    .target-pulse {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      border: 2px dashed #00e5ff;
      border-radius: 50%;
    }
    .target-dot {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 14px;
      height: 14px;
      background: #00e5ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 25px #00e5ff;
    }

    /* GPS Grand Reveal Card (Safe Zone: y ~ 1100px to 1320px) */
    .gps-reveal-card {
      position: absolute;
      top: 1080px;
      left: 70px;
      right: 70px;
      padding: 24px 32px;
      background: rgba(8, 16, 36, 0.92);
      border: 2px solid #00e5ff;
      border-radius: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 40px rgba(0, 229, 255, 0.25);
      z-index: 25;
    }
    .reveal-sub {
      font-size: 28px;
      letter-spacing: 3px;
      color: rgba(255, 255, 255, 0.8);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .reveal-title {
      font-size: 54px;
      font-weight: 700;
      color: #00e5ff;
      text-transform: uppercase;
      letter-spacing: 2px;
      line-height: 1.1;
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.7);
      margin-bottom: 12px;
    }
    .reveal-meta {
      display: flex;
      justify-content: space-between;
      border-top: 1px solid rgba(0, 229, 255, 0.3);
      padding-top: 10px;
      font-family: monospace;
      font-size: 28px;
      color: #ffffff;
    }
    .reveal-meta .acc {
      color: #22c55e;
      font-weight: bold;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="scene4">
    <img id="bgImg" class="bg-img" src="../assets/images/scene4_trilateration_gps.jpg" alt="Trilateration Intersection">
    <div class="vignette-overlay"></div>

    <!-- Title Group -->
    <div class="title-group" id="titleGroup">
      <div class="accent-bar" id="accentBar"></div>
      <div class="category-badge" id="catBadge">
        <span class="status-dot"></span>
        <span>GEOMETRIC POSITIONING</span>
      </div>
      <h1 class="main-title" id="mainTitle">
        3 SPHERES INTERSECT<br>
        <span>AT ONE EXACT POINT</span>
      </h1>
    </div>

    <!-- Center Intersection Reticle -->
    <div class="intersection-target" id="targetReticle">
      <div class="target-ring"></div>
      <div class="target-pulse" id="targetPulse"></div>
      <div class="target-dot"></div>
    </div>

    <!-- GPS Grand Reveal Card -->
    <div class="gps-reveal-card" id="gpsCard">
      <div class="reveal-sub">CONVERGENCE ACHIEVED</div>
      <div class="reveal-title">GLOBAL POSITIONING SYSTEM</div>
      <div class="reveal-meta">
        <div>COORDINATES: 17.3850° N, 78.4867° E</div>
        <div class="acc">ACCURACY: ±3 METERS</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene4"] = tl;

    // Slow push
    tl.fromTo("#bgImg", 
      { scale: 1.0, y: 0 }, 
      { scale: 1.07, y: -20, duration: 5.68, ease: "none" }, 0
    );

    // Title reveal
    tl.fromTo("#accentBar", { width: 0, opacity: 0 }, { width: 60, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.1);
    tl.fromTo("#catBadge", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, 0.2);
    tl.fromTo("#mainTitle", { y: 25, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.35);

    // Center target reticle lock
    tl.fromTo("#targetReticle", 
      { scale: 0.3, opacity: 0 }, 
      { scale: 1.0, opacity: 1, duration: 0.6, ease: "back.out(1.8)" }, 0.8
    );
    tl.to("#targetPulse", { rotation: 360, duration: 4.8, ease: "none" }, 0.8);

    // GPS Card Reveal (Syncs with "This technology is called GPS", ~3.2s)
    tl.fromTo("#gpsCard", 
      { scale: 0.85, opacity: 0, y: 30 }, 
      { scale: 1.0, opacity: 1, y: 0, duration: 0.5, ease: "back.out(1.4)" }, 3.1
    );
  </script>
</body>
</html>
