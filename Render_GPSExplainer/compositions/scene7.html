<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 7 — Conclusion & Payoff</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('../assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #060913;
      font-family: 'Oswald', -apple-system, sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .video-bg {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 45%;
    }

    /* Lighting overlay for text readability without obscuring speaker's face */
    .lighting-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: linear-gradient(
        180deg,
        rgba(6, 10, 22, 0.75) 0%,
        rgba(6, 10, 22, 0.15) 25%,
        rgba(6, 10, 22, 0.10) 65%,
        rgba(6, 10, 22, 0.85) 100%
      );
      pointer-events: none;
    }

    /* Top Left Title Group */
    .title-group {
      position: absolute;
      top: 170px;
      left: 70px;
      right: 70px;
      z-index: 20;
    }
    .accent-bar {
      width: 60px;
      height: 4px;
      background: #00e5ff;
      margin-bottom: 16px;
      border-radius: 2px;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.8);
    }
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(10, 20, 38, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.5);
      color: #00e5ff;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e5ff;
    }
    .main-title {
      font-size: 68px;
      font-weight: 700;
      line-height: 1.12;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
    }
    .main-title span {
      color: #00e5ff;
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
    }

    /* Top Right Fixed Target HUD */
    .hud-fix {
      position: absolute;
      top: 180px;
      right: 70px;
      text-align: right;
      z-index: 20;
      font-family: monospace;
      font-size: 28px;
      color: #ffffff;
      background: rgba(6, 12, 28, 0.75);
      padding: 10px 18px;
      border-left: 3px solid #22c55e;
      border-radius: 4px;
      backdrop-filter: blur(8px);
    }
    .hud-fix .status {
      color: #22c55e;
      font-weight: bold;
    }
    .hud-fix .sub-hud {
      font-size: 24px;
      color: rgba(255, 255, 255, 0.7);
    }

    /* Final Payoff Card (Placed at bottom of video, completely clear of face) */
    .payoff-card {
      position: absolute;
      bottom: 80px;
      left: 60px;
      right: 60px;
      padding: 24px 32px;
      background: rgba(8, 16, 36, 0.94);
      border: 1px solid rgba(0, 229, 255, 0.5);
      border-left: 6px solid #00e5ff;
      border-radius: 12px;
      backdrop-filter: blur(16px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.8);
      z-index: 20;
    }
    .payoff-line1 {
      font-size: 36px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.2;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }
    .payoff-line1 span {
      color: #00e5ff;
    }
    .payoff-pills {
      display: flex;
      gap: 12px;
      margin-top: 12px;
      flex-wrap: wrap;
    }
    .payoff-pill {
      font-size: 28px;
      font-family: monospace;
      color: rgba(255, 255, 255, 0.85);
      background: rgba(0, 229, 255, 0.12);
      border: 1px solid rgba(0, 229, 255, 0.3);
      padding: 6px 14px;
      border-radius: 4px;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="scene7">
    <video id="talkingHead" class="video-bg" src="../assets/videos/talking_head_scene7.mp4" muted playsinline data-start="0" data-duration="6.05"></video>
    <div class="lighting-overlay"></div>

    <!-- Title Group -->
    <div class="title-group" id="titleGroup">
      <div class="accent-bar" id="accentBar"></div>
      <div class="category-badge" id="catBadge">
        <span class="status-dot"></span>
        <span>FINAL VERDICT</span>
      </div>
      <h1 class="main-title" id="mainTitle">
        YOUR PHONE ALREADY<br>
        <span>KNOWS WHERE YOU ARE</span>
      </h1>
    </div>

    <!-- Top Right HUD -->
    <div class="hud-fix" id="hudFix">
      <div>3D FIX: <span class="status">LOCKED</span></div>
      <div class="sub-hud" data-layout-ignore="true">4+ SATELLITES IN SYNC</div>
    </div>

    <!-- Payoff Card -->
    <div class="payoff-card" id="payoffCard">
      <div class="payoff-line1">
        WITHOUT ASKING. <span>PURE PHYSICS.</span>
      </div>
      <div class="payoff-pills">
        <div class="payoff-pill">31 SATELLITES</div>
        <div class="payoff-pill">SPEED OF LIGHT MATH</div>
        <div class="payoff-pill">±3M PRECISION</div>
      </div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene7"] = tl;

    // Slow zoom
    tl.fromTo("#talkingHead", 
      { scale: 1.0 }, 
      { scale: 1.05, duration: 6.05, ease: "none" }, 0
    );

    // Header reveal
    tl.fromTo("#accentBar", { width: 0, opacity: 0 }, { width: 60, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.1);
    tl.fromTo("#catBadge", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, 0.2);
    tl.fromTo("#mainTitle", { y: 25, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.35);
    tl.fromTo("#hudFix", { opacity: 0, x: 20 }, { opacity: 1, x: 0, duration: 0.4, ease: "power2.out" }, 0.4);

    // Payoff card reveal (when speaker finishes statement ~2.0s)
    tl.fromTo("#payoffCard", 
      { y: 35, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.5, ease: "power2.out" }, 1.8
    );
  </script>
</body>
</html>
