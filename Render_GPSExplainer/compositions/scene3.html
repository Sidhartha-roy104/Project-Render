<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 3 — Signal Travel Time Calculation</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('../assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #060913;
      font-family: 'Oswald', -apple-system, sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 50%;
    }
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 50%, transparent 45%, rgba(4, 8, 20, 0.75) 100%);
      pointer-events: none;
    }

    /* Top Left Title Group */
    .title-group {
      position: absolute;
      top: 170px;
      left: 70px;
      right: 70px;
      z-index: 20;
    }
    .accent-bar {
      width: 60px;
      height: 4px;
      background: #00e5ff;
      margin-bottom: 16px;
      border-radius: 2px;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.8);
    }
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(10, 20, 38, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.5);
      color: #00e5ff;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e5ff;
    }
    .main-title {
      font-size: 68px;
      font-weight: 700;
      line-height: 1.12;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
    }
    .main-title span {
      color: #00e5ff;
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
    }

    /* Signal Timers HUD Container (Safe zone: y ~ 1040px to 1300px) */
    .timer-deck {
      position: absolute;
      top: 1040px;
      left: 70px;
      right: 70px;
      display: flex;
      gap: 20px;
      z-index: 20;
    }
    .timer-card {
      flex: 1;
      background: rgba(8, 16, 36, 0.88);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-top: 4px solid #00e5ff;
      border-radius: 8px;
      padding: 16px 20px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      text-align: center;
    }
    .timer-sat {
      font-size: 28px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .timer-val {
      font-size: 38px;
      font-weight: 700;
      color: #00e5ff;
      font-family: monospace;
      letter-spacing: 1px;
    }
    .timer-unit {
      font-size: 28px;
      color: #ffb300;
      margin-left: 2px;
    }

    /* Math formula card */
    .formula-card {
      position: absolute;
      top: 1200px;
      left: 70px;
      right: 70px;
      padding: 18px 26px;
      background: rgba(6, 12, 28, 0.9);
      border: 1px solid rgba(0, 229, 255, 0.5);
      border-radius: 8px;
      backdrop-filter: blur(12px);
      display: flex;
      align-items: center;
      justify-content: space-between;
      z-index: 20;
    }
    .formula-label {
      font-size: 28px;
      color: rgba(255, 255, 255, 0.7);
      letter-spacing: 2px;
      text-transform: uppercase;
    }
    .formula-math {
      font-size: 32px;
      font-weight: 700;
      color: #ffffff;
      letter-spacing: 2px;
      font-family: monospace;
    }
    .formula-math span {
      color: #00e5ff;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="scene3">
    <img id="bgImg" class="bg-img" src="../assets/images/scene3_signals_smartphone.jpg" alt="Signal Travel Calculation">
    <div class="vignette-overlay"></div>

    <!-- Title Group -->
    <div class="title-group" id="titleGroup">
      <div class="accent-bar" id="accentBar"></div>
      <div class="category-badge" id="catBadge">
        <span class="status-dot"></span>
        <span>TIME-OF-FLIGHT MATH</span>
      </div>
      <h1 class="main-title" id="mainTitle">
        CALCULATING SIGNAL<br>
        <span>TRAVEL TIME IN NANOSECONDS</span>
      </h1>
    </div>

    <!-- 3 Satellite Arrival Timers -->
    <div class="timer-deck" id="timerDeck">
      <div class="timer-card" id="cardSat1">
        <div class="timer-sat">SAT #08</div>
        <div class="timer-val" id="valSat1">67.4<span class="timer-unit">ms</span></div>
      </div>
      <div class="timer-card" id="cardSat2">
        <div class="timer-sat">SAT #14</div>
        <div class="timer-val" id="valSat2">71.8<span class="timer-unit">ms</span></div>
      </div>
      <div class="timer-card" id="cardSat3">
        <div class="timer-sat">SAT #23</div>
        <div class="timer-val" id="valSat3">65.2<span class="timer-unit">ms</span></div>
      </div>
    </div>

    <!-- Formula Box -->
    <div class="formula-card" id="formulaCard">
      <div class="formula-label">TRILATERATION FORMULA</div>
      <div class="formula-math">DISTANCE = <span>C</span> × <span>Δt</span></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene3"] = tl;

    // Slow push-in
    tl.fromTo("#bgImg", 
      { scale: 1.0, y: 0 }, 
      { scale: 1.08, y: -25, duration: 4.00, ease: "none" }, 0
    );

    // Title reveal
    tl.fromTo("#accentBar", { width: 0, opacity: 0 }, { width: 60, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.1);
    tl.fromTo("#catBadge", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, 0.2);
    tl.fromTo("#mainTitle", { y: 25, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.35);

    // Timers stagger in
    tl.fromTo(["#cardSat1", "#cardSat2", "#cardSat3"], 
      { y: 35, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.4, stagger: 0.15, ease: "power2.out" }, 0.8
    );

    // Formula card reveal
    tl.fromTo("#formulaCard", 
      { y: 30, opacity: 0 }, 
      { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 1.4
    );
  </script>
</body>
</html>
