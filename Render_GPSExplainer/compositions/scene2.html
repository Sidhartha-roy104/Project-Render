<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Scene 2 — Satellites Orbiting Earth</title>
  <style>
    @font-face {
      font-family: 'Oswald';
      src: url('../assets/fonts/Oswald.ttf') format('truetype');
      font-weight: 200 700;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html {
      width: 1080px;
      height: 1920px;
      overflow: hidden;
      background: #060913;
      font-family: 'Oswald', -apple-system, sans-serif;
    }
    #root {
      position: relative;
      width: 1080px;
      height: 1920px;
      overflow: hidden;
    }
    .bg-img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transform-origin: 50% 50%;
    }

    /* Lighting Vignette */
    .vignette-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: radial-gradient(ellipse at 50% 50%, transparent 50%, rgba(4, 8, 20, 0.7) 100%);
      pointer-events: none;
    }

    /* Top Left Title Group */
    .title-group {
      position: absolute;
      top: 170px;
      left: 70px;
      right: 70px;
      z-index: 20;
    }
    .accent-bar {
      width: 60px;
      height: 4px;
      background: #00e5ff;
      margin-bottom: 16px;
      border-radius: 2px;
      box-shadow: 0 0 16px rgba(0, 229, 255, 0.8);
    }
    .category-badge {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      padding: 8px 18px;
      background: rgba(10, 20, 38, 0.85);
      border: 1px solid rgba(0, 229, 255, 0.5);
      color: #00e5ff;
      font-size: 28px;
      font-weight: 600;
      letter-spacing: 3px;
      text-transform: uppercase;
      border-radius: 6px;
      margin-bottom: 14px;
      backdrop-filter: blur(8px);
    }
    .status-dot {
      width: 10px;
      height: 10px;
      background: #00e5ff;
      border-radius: 50%;
      box-shadow: 0 0 10px #00e5ff;
    }
    .main-title {
      font-size: 68px;
      font-weight: 700;
      line-height: 1.12;
      color: #ffffff;
      text-transform: uppercase;
      text-shadow: 0 4px 24px rgba(0, 0, 0, 0.8);
    }
    .main-title span {
      color: #00e5ff;
      text-shadow: 0 0 25px rgba(0, 229, 255, 0.6);
    }

    /* Telemetry Info Cards (Within safe zone) */
    .info-card-left {
      position: absolute;
      top: 1080px;
      left: 70px;
      padding: 20px 24px;
      background: rgba(8, 16, 36, 0.88);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-left: 5px solid #00e5ff;
      border-radius: 8px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 20;
      width: 440px;
    }
    .info-card-right {
      position: absolute;
      top: 1080px;
      right: 70px;
      padding: 20px 24px;
      background: rgba(8, 16, 36, 0.88);
      border: 1px solid rgba(0, 229, 255, 0.4);
      border-left: 5px solid #ffb300;
      border-radius: 8px;
      backdrop-filter: blur(12px);
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.6);
      z-index: 20;
      width: 440px;
    }
    .card-label {
      font-size: 28px;
      letter-spacing: 2px;
      color: rgba(255, 255, 255, 0.7);
      text-transform: uppercase;
      margin-bottom: 6px;
    }
    .card-val {
      font-size: 34px;
      font-weight: 700;
      color: #ffffff;
      line-height: 1.1;
    }
    .card-val em {
      font-style: normal;
      color: #00e5ff;
    }

    /* Orbital Beacons */
    .beacon {
      position: absolute;
      width: 40px;
      height: 40px;
      pointer-events: none;
      z-index: 15;
    }
    .beacon-ring {
      position: absolute;
      width: 100%;
      height: 100%;
      border: 2px solid #00e5ff;
      border-radius: 50%;
    }
    .beacon-core {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 10px;
      height: 10px;
      background: #00e5ff;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 15px #00e5ff;
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
</head>
<body>
  <div id="root" data-composition-id="scene2">
    <img id="bgImg" class="bg-img" src="../assets/images/scene2_earth_satellites.jpg" alt="Satellites Orbiting Earth">
    <div class="vignette-overlay"></div>

    <!-- Title Group -->
    <div class="title-group" id="titleGroup">
      <div class="accent-bar" id="accentBar"></div>
      <div class="category-badge" id="catBadge">
        <span class="status-dot"></span>
        <span>SPACE SEGMENT</span>
      </div>
      <h1 class="main-title" id="mainTitle">
        SATELLITES ORBITING<br>
        <span>20,200 KM ABOVE EARTH</span>
      </h1>
    </div>

    <!-- Satellite Beacon Pulses -->
    <div class="beacon" id="beacon1" style="top: 480px; left: 320px;">
      <div class="beacon-ring" id="beaconRing1"></div>
      <div class="beacon-core"></div>
    </div>
    <div class="beacon" id="beacon2" style="top: 360px; right: 280px;">
      <div class="beacon-ring" id="beaconRing2"></div>
      <div class="beacon-core"></div>
    </div>

    <!-- Telemetry Cards -->
    <div class="info-card-left" id="cardLeft">
      <div class="card-label">CONSTELLATION</div>
      <div class="card-val">31 ACTIVE <em>SATELLITES</em></div>
    </div>

    <div class="info-card-right" id="cardRight">
      <div class="card-label">ORBITAL SPEED</div>
      <div class="card-val">~14,000 <em>KM/H</em></div>
    </div>
  </div>

  <script>
    window.__timelines = window.__timelines || {};
    const tl = gsap.timeline({ paused: true });
    window.__timelines["scene2"] = tl;

    // Slow cinematic push-in
    tl.fromTo("#bgImg", 
      { scale: 1.0, y: 0 }, 
      { scale: 1.08, y: -20, duration: 3.26, ease: "none" }, 0
    );

    // Header reveal
    tl.fromTo("#accentBar", { width: 0, opacity: 0 }, { width: 60, opacity: 1, duration: 0.35, ease: "power2.out" }, 0.1);
    tl.fromTo("#catBadge", { y: -20, opacity: 0 }, { y: 0, opacity: 1, duration: 0.35, ease: "back.out(1.5)" }, 0.2);
    tl.fromTo("#mainTitle", { y: 25, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.35);

    // Beacons pulse
    tl.fromTo(["#beacon1", "#beacon2"], { scale: 0, opacity: 0 }, { scale: 1, opacity: 1, duration: 0.4, stagger: 0.2, ease: "back.out(2)" }, 0.5);
    tl.fromTo(["#beaconRing1", "#beaconRing2"], 
      { scale: 0.8, opacity: 1 }, 
      { scale: 2.2, opacity: 0, duration: 1.2, repeat: 2, ease: "power1.out" }, 0.7
    );

    // Info cards slide up
    tl.fromTo("#cardLeft", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.7);
    tl.fromTo("#cardRight", { y: 40, opacity: 0 }, { y: 0, opacity: 1, duration: 0.45, ease: "power2.out" }, 0.9);
  </script>
</body>
</html>
